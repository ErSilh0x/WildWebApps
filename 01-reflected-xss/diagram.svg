<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 280" width="1320" height="280" font-family="'Space Grotesk','Segoe UI',system-ui,sans-serif">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#21262d" stroke-width="1" opacity="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#8b949e"/>
    </marker>
    <marker id="arrow-green" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#4ade80"/>
    </marker>
  </defs>

  <!-- canvas -->
  <rect x="0" y="0" width="1320" height="280" fill="#0d1117"/>
  <rect x="0" y="0" width="1320" height="280" fill="url(#grid)"/>

  <!-- title -->
  <text x="22" y="40" font-size="13" font-family="'JetBrains Mono',monospace" fill="#00caff" letter-spacing="1">&gt;_</text>
  <text x="50" y="42" font-size="20" font-weight="700" fill="#e6edf3">Reflected XSS (Server-Side) - Attack Path</text>

  <!-- legend -->
  <circle cx="852" cy="36" r="5" fill="#f85149"/>
  <text x="864" y="40" font-size="12" fill="#8b949e">vulnerable step</text>
  <circle cx="992" cy="36" r="5" fill="#f97316"/>
  <text x="1004" y="40" font-size="12" fill="#8b949e">impact</text>
  <circle cx="1092" cy="36" r="5" fill="#4ade80"/>
  <text x="1104" y="40" font-size="12" fill="#8b949e">goal</text>

  <!-- edges (drawn first, under the nodes) -->
  <g stroke-width="1.5">
    <line x1="160" y1="162" x2="179" y2="162" stroke="#8b949e" marker-end="url(#arrow)"/>
    <line x1="322" y1="162" x2="341" y2="162" stroke="#8b949e" marker-end="url(#arrow)"/>
    <line x1="484" y1="162" x2="503" y2="162" stroke="#8b949e" marker-end="url(#arrow)"/>
    <line x1="646" y1="162" x2="665" y2="162" stroke="#f85149" marker-end="url(#arrow)"/>
    <line x1="808" y1="162" x2="827" y2="162" stroke="#f97316" marker-end="url(#arrow)"/>
    <line x1="970" y1="162" x2="989" y2="162" stroke="#8b949e" marker-end="url(#arrow)"/>
    <line x1="1132" y1="162" x2="1151" y2="162" stroke="#4ade80" marker-end="url(#arrow-green)"/>
  </g>

  <!-- n0 Attacker -->
  <rect x="20" y="120" width="140" height="84" rx="6" fill="#161b22" stroke="#00caff" stroke-width="1.5"/>
  <text x="90" y="167" text-anchor="middle" font-size="14" font-weight="700" fill="#5cd6f7">Attacker</text>

  <!-- n1 Craft link -->
  <rect x="182" y="120" width="140" height="84" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="252" y="154" text-anchor="middle" font-size="12.5" font-weight="600" fill="#e6edf3">1. Craft link</text>
  <text x="252" y="177" text-anchor="middle" font-size="11" font-family="'JetBrains Mono',monospace" fill="#a0e9ff">?q=&lt;script&gt;</text>

  <!-- n2 Deliver -->
  <rect x="344" y="120" width="140" height="84" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="414" y="154" text-anchor="middle" font-size="12.5" font-weight="600" fill="#e6edf3">2. Deliver via</text>
  <text x="414" y="177" text-anchor="middle" font-size="12" fill="#8b949e">phishing email</text>

  <!-- n3 Admin opens -->
  <rect x="506" y="120" width="140" height="84" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="576" y="154" text-anchor="middle" font-size="12.5" font-weight="600" fill="#e6edf3">3. Victim clicks</text>
  <text x="576" y="177" text-anchor="middle" font-size="11" fill="#8b949e">logged-in user</text>

  <!-- n4 Reflect UNENCODED (vulnerable) -->
  <rect x="668" y="120" width="140" height="84" rx="6" fill="#1c2128" stroke="#f85149" stroke-width="2"/>
  <text x="738" y="154" text-anchor="middle" font-size="12.5" font-weight="600" fill="#e6edf3">4. Reflects q</text>
  <text x="738" y="178" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ff6b6b" letter-spacing="0.5">UNENCODED</text>

  <!-- n5 Script runs (impact) -->
  <rect x="830" y="120" width="140" height="84" rx="6" fill="#161b22" stroke="#f97316" stroke-width="1.5"/>
  <text x="900" y="154" text-anchor="middle" font-size="12.5" font-weight="600" fill="#e6edf3">5. Script runs in</text>
  <text x="900" y="177" text-anchor="middle" font-size="11" fill="#8b949e">victim's browser</text>

  <!-- n6 Exfiltrate -->
  <rect x="992" y="120" width="140" height="84" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="1062" y="154" text-anchor="middle" font-size="12.5" font-weight="600" fill="#e6edf3">6. Cookie sent to</text>
  <text x="1062" y="177" text-anchor="middle" font-size="11" fill="#8b949e">attacker server</text>

  <!-- n7 Flag (goal) -->
  <rect x="1154" y="120" width="140" height="84" rx="6" fill="#161b22" stroke="#4ade80" stroke-width="2"/>
  <text x="1224" y="154" text-anchor="middle" font-size="11.5" font-weight="700" fill="#4ade80">7. Account takeover</text>
  <text x="1224" y="177" text-anchor="middle" font-size="11" fill="#8b949e">session hijack</text>

  <!-- caption -->
  <text x="22" y="252" font-size="12.5" fill="#6e7681">The payload travels in the request; the server echoes it into the response unencoded, and the victim's browser executes it in the victim's session.</text>
</svg>
