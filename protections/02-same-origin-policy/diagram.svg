<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 660" width="1040" height="660" font-family="'Space Grotesk','Segoe UI',system-ui,sans-serif">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#21262d" stroke-width="1" opacity="0.5"/></pattern>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3 L0,6 Z" fill="#8b949e"/></marker>
    <marker id="arGreen" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3 L0,6 Z" fill="#4ade80"/></marker>
    <marker id="arAmber" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L7,3 L0,6 Z" fill="#d29922"/></marker>
  </defs>
  <rect x="0" y="0" width="1040" height="660" fill="#0d1117"/>
  <rect x="0" y="0" width="1040" height="660" fill="url(#grid)"/>
  <text x="22" y="34" font-size="13" font-family="'JetBrains Mono',monospace" fill="#00caff" letter-spacing="1">&gt;_</text>
  <text x="50" y="36" font-size="19" font-weight="700" fill="#e6edf3">Same-Origin Policy - Defense Path</text>
  <line x1="892" y1="20" x2="916" y2="20" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="922" y="24" font-size="11" fill="#8b949e">request</text>
  <line x1="892" y1="38" x2="916" y2="38" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#ar)"/>
  <text x="922" y="42" font-size="11" fill="#8b949e">response</text>
  <line x1="892" y1="56" x2="916" y2="56" stroke="#4ade80" stroke-width="1.5" marker-end="url(#arGreen)"/>
  <text x="922" y="60" font-size="11" fill="#8b949e">defense holds</text>
  <line x1="892" y1="74" x2="916" y2="74" stroke="#d29922" stroke-width="1.5" marker-end="url(#arAmber)"/>
  <text x="922" y="78" font-size="11" fill="#e3b341">limitation</text>
  <line x1="150" y1="110" x2="150" y2="584" stroke="#30363d" stroke-width="1.5" stroke-dasharray="4 5"/>
  <line x1="480" y1="110" x2="480" y2="584" stroke="#30363d" stroke-width="1.5" stroke-dasharray="4 5"/>
  <line x1="800" y1="110" x2="800" y2="584" stroke="#30363d" stroke-width="1.5" stroke-dasharray="4 5"/>
  <rect x="75" y="64" width="150" height="46" rx="6" fill="#161b22" stroke="#00caff" stroke-width="1.5"/>
  <text x="150" y="87" text-anchor="middle" font-size="14" font-weight="700" fill="#5cd6f7">Attacker</text>
  <text x="150" y="101" text-anchor="middle" font-size="9" font-family="'JetBrains Mono',monospace" fill="#8b949e">evil.example</text>
  <rect x="405" y="64" width="150" height="46" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="480" y="87" text-anchor="middle" font-size="14" font-weight="700" fill="#e6edf3">Victim browser</text>
  <text x="480" y="101" text-anchor="middle" font-size="9" font-family="'JetBrains Mono',monospace" fill="#8b949e">bank.example tab</text>
  <rect x="725" y="64" width="150" height="46" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="800" y="87" text-anchor="middle" font-size="14" font-weight="700" fill="#e6edf3">Server</text>
  <text x="800" y="101" text-anchor="middle" font-size="9" font-family="'JetBrains Mono',monospace" fill="#8b949e">bank.example</text>
  <text x="480" y="134" text-anchor="middle" font-size="9.5" font-style="italic" fill="#6e7681">logged in to bank.example, SameSite=Lax session cookie</text>
  <text x="315" y="147" text-anchor="middle" font-size="11" fill="#e6edf3">1. Victim opens the attacker page</text>
  <text x="315" y="159" text-anchor="middle" font-size="9.5" font-family="'JetBrains Mono',monospace" fill="#a0e9ff">evil.example (a different origin)</text>
  <line x1="158" y1="166" x2="472" y2="166" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="640" y="200" text-anchor="middle" font-size="11" fill="#e6edf3">2. attacker JS: fetch(bank.example/api/account, credentials)</text>
  <text x="640" y="212" text-anchor="middle" font-size="9.5" font-family="'JetBrains Mono',monospace" fill="#a0e9ff">browser attaches the bank session cookie</text>
  <line x1="488" y1="219" x2="792" y2="219" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="640" y="245" text-anchor="middle" font-size="11" fill="#e6edf3">3. 200 OK: account JSON (no CORS grant)</text>
  <line x1="792" y1="252" x2="488" y2="252" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#ar)"/>
  <rect x="332" y="290" width="296" height="50" rx="6" fill="#161b22" stroke="#4ade80" stroke-width="1.5"/>
  <text x="480" y="311" text-anchor="middle" font-size="10.5" font-weight="600" fill="#e6edf3">Same-Origin Policy: cross-origin read refused</text>
  <text x="480" y="327" text-anchor="middle" font-size="9" fill="#8b949e">evil.example's script cannot read the response</text>
  <text x="315" y="366" text-anchor="middle" font-size="11" fill="#e6edf3">4. read blocked: TypeError, no data</text>
  <line x1="472" y1="373" x2="158" y2="373" stroke="#4ade80" stroke-width="2" marker-end="url(#arGreen)"/>
  <text x="640" y="407" text-anchor="middle" font-size="11" fill="#e3b341">5. CORS misconfig: Access-Control-Allow-Origin</text>
  <text x="640" y="419" text-anchor="middle" font-size="9.5" font-family="'JetBrains Mono',monospace" fill="#e3b341">reflects evil.example, Allow-Credentials: true</text>
  <line x1="792" y1="426" x2="488" y2="426" stroke="#d29922" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arAmber)"/>
  <text x="315" y="460" text-anchor="middle" font-size="11" fill="#e3b341">6. response handed to the attacker</text>
  <line x1="472" y1="467" x2="158" y2="467" stroke="#d29922" stroke-width="2" marker-end="url(#arAmber)"/>
  <text x="22" y="610" font-size="12.5" fill="#6e7681">SOP lets the request be sent but stops the attacker reading the cross-origin response, so the steal <tspan fill="#4ade80" font-weight="700">fails</tspan>.</text>
  <text x="22" y="628" font-size="12.5" fill="#6e7681">It is undone by a CORS policy that reflects the Origin with credentials (<tspan fill="#e3b341" font-weight="700">the boundary</tspan>), or by an XSS inside the origin.</text>
</svg>
