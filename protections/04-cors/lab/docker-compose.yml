name: 04-cors
services:
  lab:
    build: .
    image: 04-cors:latest
    container_name: 04-cors
    # Publish on the host loopback only - never exposed to the network. The two
    # origins are split by PORT (same host, so same site, but different origin):
    # the bank at http://127.0.0.1:8000 and the attacker console at
    # http://127.0.0.1:8001. The app routes by the port in the Host header.
    ports:
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:8001:8001"
    environment:
      - HOST=0.0.0.0
      - BANK_PORT=8000
      - ATTACKER_PORT=8001
    restart: unless-stopped
