<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 760" font-family="'Space Grotesk','Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arw" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3 L0,6 Z" fill="#00caff"/>
    </marker>
    <marker id="arwR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3 L0,6 Z" fill="#f85149"/>
    </marker>
    <marker id="arwG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3 L0,6 Z" fill="#8b949e"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="940" height="760" fill="#0d1117"/>
  <text x="30" y="38" fill="#e6edf3" font-size="21" font-weight="700">Insecure Direct Object Reference &#183; attack sequence</text>
  <text x="30" y="60" fill="#8b949e" font-size="12.5">A signed-in customer's profile is addressed by an account id in the URL. The server looks the account up by that id but never</text>
  <text x="30" y="77" fill="#8b949e" font-size="12.5">checks it belongs to the caller, so changing the number returns another customer's account, and then the administrator's. Red steps are the attack.</text>

  <!-- Lifeline heads -->
  <g font-size="14" font-weight="700" text-anchor="middle">
    <rect x="45" y="98" width="180" height="58" rx="8" fill="#161b22" stroke="#f85149" stroke-width="1.5"/>
    <text x="135" y="120" fill="#f85149">Attacker</text>
    <text x="135" y="138" fill="#8b949e" font-size="11" font-weight="400">signed-in customer 1003</text>

    <rect x="370" y="98" width="220" height="58" rx="8" fill="#161b22" stroke="#00caff" stroke-width="1.5"/>
    <text x="480" y="120" fill="#e6edf3">app.wildvault.io</text>
    <text x="480" y="138" fill="#8b949e" font-size="11" font-weight="400">account portal</text>

    <rect x="730" y="98" width="185" height="58" rx="8" fill="#161b22" stroke="#00caff" stroke-width="1.5"/>
    <text x="822" y="120" fill="#e6edf3">Accounts database</text>
    <text x="822" y="138" fill="#8b949e" font-size="11" font-weight="400">customers 1001..1005</text>
  </g>

  <!-- Lifelines -->
  <g stroke="#30363d" stroke-width="1.5" stroke-dasharray="4 4">
    <line x1="135" y1="156" x2="135" y2="714"/>
    <line x1="480" y1="156" x2="480" y2="714"/>
    <line x1="822" y1="156" x2="822" y2="714"/>
  </g>

  <!-- Messages -->
  <g font-size="12.5">
    <!-- 1 legit own profile -->
    <line x1="135" y1="196" x2="478" y2="196" stroke="#00caff" stroke-width="1.6" marker-end="url(#arw)"/>
    <text x="141" y="189" fill="#e6edf3">1. Normal use: GET <tspan font-family="monospace" fill="#00caff">/profile?id=1003</tspan> (own account)</text>

    <!-- 2 store returns own -->
    <line x1="480" y1="226" x2="820" y2="226" stroke="#00caff" stroke-width="1.6" marker-end="url(#arw)"/>
    <text x="487" y="221" fill="#8b949e" font-family="monospace" font-size="11">load account 1003, return it (legitimately the caller's)</text>

    <!-- 3 attacker tampers to a peer -->
    <line x1="135" y1="274" x2="478" y2="274" stroke="#f85149" stroke-width="2" marker-end="url(#arwR)"/>
    <text x="141" y="267" fill="#f85149" font-weight="600">2. Tamper the id: GET <tspan font-family="monospace">/profile?id=1002</tspan></text>
    <text x="141" y="289" fill="#8b949e" font-family="monospace" font-size="11">1002 is another customer, not the caller</text>

    <!-- 4 app loads no check -->
    <line x1="480" y1="322" x2="820" y2="322" stroke="#f85149" stroke-width="2" marker-end="url(#arwR)"/>
    <text x="487" y="315" fill="#f85149" font-weight="600">3. VULNERABLE: load account 1002, no ownership check</text>
    <text x="487" y="337" fill="#8b949e" font-family="monospace" font-size="11">never compares the id to the signed-in user (1003)</text>

    <!-- 5 peer profile back -->
    <line x1="822" y1="366" x2="482" y2="366" stroke="#f85149" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#arwR)"/>
    <text x="652" y="359" fill="#8b949e" text-anchor="middle">4. another customer's profile returned</text>

    <!-- 6 attacker tampers to admin -->
    <line x1="135" y1="410" x2="478" y2="410" stroke="#f85149" stroke-width="2" marker-end="url(#arwR)"/>
    <text x="141" y="403" fill="#f85149" font-weight="600">5. Walk the id down: GET <tspan font-family="monospace">/profile?id=1001</tspan> (administrator)</text>
    <text x="141" y="425" fill="#8b949e" font-family="monospace" font-size="11">1001 is the first account, an administrator</text>

    <!-- 7 admin returned -->
    <line x1="480" y1="458" x2="820" y2="458" stroke="#f85149" stroke-width="2" marker-end="url(#arwR)"/>
    <text x="487" y="451" fill="#f85149" font-weight="600">6. VULNERABLE: administrator account returned, still no check</text>

    <!-- 8 private data to attacker -->
    <line x1="480" y1="490" x2="137" y2="490" stroke="#f85149" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#arwR)"/>
    <text x="308" y="483" fill="#8b949e" text-anchor="middle">7. response includes the admin's private account recovery key</text>

    <!-- pivot note -->
    <rect x="135" y="512" width="700" height="30" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="148" y="531" fill="#c9d1d9" font-size="11.5">Same flaw reaches any object: <tspan font-family="monospace" fill="#00caff">/invoice?id=</tspan> &#183; <tspan font-family="monospace" fill="#00caff">/api/users/{id}</tspan> &#183; <tspan font-family="monospace" fill="#00caff">/download?file=</tspan> &#183; ids in a cookie or POST body</text>

    <!-- impact box -->
    <rect x="135" y="558" width="700" height="98" rx="8" fill="#161b22" stroke="#f85149" stroke-width="1.5"/>
    <text x="150" y="582" fill="#f85149" font-size="13" font-weight="700">Impact</text>
    <text x="150" y="602" fill="#c9d1d9" font-size="12">By changing one number the attacker reads accounts that are not theirs, including the</text>
    <text x="150" y="619" fill="#c9d1d9" font-size="12">administrator's, and lifts private data. Iterating the id turns one missing check into a bulk breach.</text>
    <text x="150" y="642" fill="#8b949e" font-size="11.5">Fix: after loading the object, verify it belongs to the current user (or that they are authorized) before returning it.</text>

    <!-- legend -->
    <g font-size="11">
      <line x1="150" y1="690" x2="180" y2="690" stroke="#00caff" stroke-width="1.6" marker-end="url(#arw)"/>
      <text x="187" y="694" fill="#8b949e">legitimate request</text>
      <line x1="320" y1="690" x2="350" y2="690" stroke="#f85149" stroke-width="2" marker-end="url(#arwR)"/>
      <text x="357" y="694" fill="#ff6b6b">attack step</text>
      <line x1="495" y1="690" x2="525" y2="690" stroke="#8b949e" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#arwG)"/>
      <text x="532" y="694" fill="#8b949e">response / data</text>
    </g>
  </g>
</svg>
