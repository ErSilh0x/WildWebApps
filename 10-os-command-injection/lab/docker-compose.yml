# Named after the folder slug so the image and container show up as the
# vulnerability (10-os-command-injection) instead of the default lab-lab.
name: 10-os-command-injection
services:
  lab:
    build: .
    image: 10-os-command-injection:latest
    container_name: 10-os-command-injection
    # Publish on the host loopback only - never exposed to the network.
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - SECRET_FILE=/root/secret.txt
    restart: unless-stopped
