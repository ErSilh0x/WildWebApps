# Named after the folder slug so the image and container show up as the
# vulnerability (09-xxe) instead of the default lab-lab.
name: 09-xxe
services:
  lab:
    build: .
    image: 09-xxe:latest
    container_name: 09-xxe
    # Publish on the host loopback only - never exposed to the network.
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - PASSWD_FILE=/etc/passwd
    restart: unless-stopped
