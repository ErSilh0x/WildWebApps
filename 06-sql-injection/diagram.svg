<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 680" font-family="'Space Grotesk','Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arw" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3 L0,6 Z" fill="#00caff"/>
    </marker>
    <marker id="arwR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3 L0,6 Z" fill="#f85149"/>
    </marker>
    <marker id="arwG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,3 L0,6 Z" fill="#8b949e"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="940" height="680" fill="#0d1117"/>
  <text x="30" y="38" fill="#e6edf3" font-size="21" font-weight="700">SQL Injection &#183; attack sequence</text>
  <text x="30" y="60" fill="#8b949e" font-size="13">Untrusted input is concatenated into the query; the database parses it as code. The red steps are the vulnerable ones.</text>

  <!-- Lifeline heads -->
  <g font-size="14" font-weight="700" text-anchor="middle">
    <rect x="70" y="86" width="150" height="42" rx="8" fill="#161b22" stroke="#f85149" stroke-width="1.5"/>
    <text x="145" y="112" fill="#f85149">Attacker</text>
    <rect x="405" y="86" width="180" height="42" rx="8" fill="#161b22" stroke="#00caff" stroke-width="1.5"/>
    <text x="495" y="106" fill="#e6edf3">Citizen Services</text>
    <text x="495" y="122" fill="#8b949e" font-size="11" font-weight="400">web app (Flask)</text>
    <rect x="760" y="86" width="150" height="42" rx="8" fill="#161b22" stroke="#00caff" stroke-width="1.5"/>
    <text x="835" y="106" fill="#e6edf3">Database</text>
    <text x="835" y="122" fill="#8b949e" font-size="11" font-weight="400">MySQL/PG/MSSQL/Oracle</text>
  </g>

  <!-- Lifelines -->
  <g stroke="#30363d" stroke-width="1.5" stroke-dasharray="4 4">
    <line x1="145" y1="128" x2="145" y2="636"/>
    <line x1="495" y1="128" x2="495" y2="636"/>
    <line x1="835" y1="128" x2="835" y2="636"/>
  </g>

  <!-- Messages -->
  <g font-size="12.5">
    <!-- 1 probe -->
    <line x1="145" y1="168" x2="493" y2="168" stroke="#00caff" stroke-width="1.6" marker-end="url(#arw)"/>
    <text x="150" y="161" fill="#e6edf3">1. Probe: surname = <tspan font-family="monospace" fill="#00caff">'</tspan></text>

    <!-- 2 vulnerable query -->
    <line x1="495" y1="208" x2="833" y2="208" stroke="#f85149" stroke-width="2" marker-end="url(#arwR)"/>
    <text x="500" y="201" fill="#f85149" font-weight="600">2. VULNERABLE: <tspan font-family="monospace">... WHERE surname = ''' </tspan></text>
    <text x="500" y="223" fill="#8b949e" font-family="monospace" font-size="11">input concatenated into SQL text</text>

    <!-- 3 db error back -->
    <line x1="835" y1="256" x2="497" y2="256" stroke="#8b949e" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#arwG)"/>
    <text x="600" y="249" fill="#8b949e" text-anchor="middle">3. SQL syntax error / extra rows</text>

    <!-- 4 confirm to attacker -->
    <line x1="495" y1="296" x2="147" y2="296" stroke="#8b949e" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#arwG)"/>
    <text x="320" y="289" fill="#8b949e" text-anchor="middle">4. Error reflected: injection confirmed</text>

    <!-- enumerate note -->
    <rect x="150" y="316" width="690" height="30" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="165" y="335" fill="#c9d1d9" font-size="12">5. Enumerate: <tspan font-family="monospace" fill="#00caff">version</tspan> &#8594; <tspan font-family="monospace" fill="#00caff">current user</tspan> &#8594; <tspan font-family="monospace" fill="#00caff">databases</tspan> &#8594; <tspan font-family="monospace" fill="#00caff">tables</tspan> &#8594; <tspan font-family="monospace" fill="#00caff">columns</tspan></text>

    <!-- 6 union payload -->
    <line x1="145" y1="386" x2="493" y2="386" stroke="#00caff" stroke-width="1.6" marker-end="url(#arw)"/>
    <text x="150" y="379" fill="#e6edf3">6. Payload: <tspan font-family="monospace" fill="#00caff">' UNION SELECT ...FROM user_table-- -</tspan></text>

    <!-- 7 vulnerable query 2 -->
    <line x1="495" y1="426" x2="833" y2="426" stroke="#f85149" stroke-width="2" marker-end="url(#arwR)"/>
    <text x="500" y="419" fill="#f85149" font-weight="600">7. VULNERABLE: original query UNION attacker query</text>

    <!-- 8 rows back -->
    <line x1="835" y1="466" x2="497" y2="466" stroke="#8b949e" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#arwG)"/>
    <text x="600" y="459" fill="#8b949e" text-anchor="middle">8. citizen rows + user_table rows</text>

    <!-- 9 exfil to attacker -->
    <line x1="495" y1="506" x2="147" y2="506" stroke="#8b949e" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#arwG)"/>
    <text x="320" y="499" fill="#8b949e" text-anchor="middle">9. username : password_hash exfiltrated</text>

    <!-- outcome box -->
    <rect x="150" y="536" width="690" height="66" rx="8" fill="#161b22" stroke="#f85149" stroke-width="1.5"/>
    <text x="165" y="560" fill="#f85149" font-size="13" font-weight="700">Outcome</text>
    <text x="165" y="580" fill="#c9d1d9" font-size="12">The MD5 flag stored as <tspan font-family="monospace" fill="#00caff">wwa_admin</tspan>'s password_hash is recovered from another table.</text>
    <text x="165" y="596" fill="#8b949e" font-size="11.5">Fix: parameterized queries send SQL structure and values on separate channels, so input can never become code.</text>
  </g>
</svg>
